<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Choose a Pancho</title>
    </head>

    <body>
        <h1>Choose a Pancho</h1>

        <section id="dog-selection" class="images">
            <!-- Dog CEO will put the two Pancho options here -->
        </section>

        <section class="NamePancho">
            <form>
                <div class="w-full">
                    <label for="name" class="block text-white mb-1">
                        Username:
                    </label>

                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="w-full rounded px-3 py-2"
                    >

                    <span 
                        id="nameError" 
                        class="block text-red-200 text-sm mt-1">
                    </span>
                </div>

                <div class="w-full">
                    <label for="password" class="block text-white mb-1">
                        Password:
                    </label>

                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="w-full rounded px-3 py-2"
                    >

                    <span 
                        id="passwordError" 
                        class="block text-red-200 text-sm mt-1">
                    </span>
                </div>

                <div class="w-full">
                    <label for="email" class="block text-white mb-1">
                        E-mail:
                    </label>

                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="w-full rounded px-3 py-2"
                    >

                    <span 
                        id="emailError" 
                        class="block text-red-200 text-sm mt-1">
                    </span>
                </div>
            </form>
        </section>

        <section>
            <h2>Select this paw to confirm</h2>

            <!-- Put your paw image here -->
            <img 
                id="confirm-paw" 
                src="TU-IMAGEN-DE-LA-PATA" 
                alt="Confirm Pancho selection"
            >
        </section>

        <script src="js/dogApi.js"></script>
        <script type="module" src="js/main.js"></script>

    </body>
</html>
