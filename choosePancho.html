<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Choose a Pancho</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="min-h-screen bg-[#8B8170] flex flex- col items-center">
        <h1 class="text-4xl font-bold tracking-widest text-white mt-8 mb-12">Choose  to pancho</h1>

        <!--debes agregar las imagenes correspondientes a choose a pancho-->

    <section class = "images flex items-center justify-center gap-16 mb-12">
        <img src = "no se" class="w-48 h-48 object-cover rounded-xl bg-[#D9D9D9] shadow-lg">
        <img src = "no se x2" class="w-48 h-48 object-cover rounded-xl bg-[#D9D9D9] shadow-lg">

    </section>

    <section class="NamePancho mb-14">

        <form>
            <div class="w-full">
                    <label for="name" class="block text-white mb-1">Username:</label>
                    <input type="text" id="name" name="name" class="w-full rounded px-3 py-2 shadow-md">
                    <span id="nameError" class="block text-red-200 text-sm mt-1"></span>
                </div>

                <div class="w-full">
                    <label for="password" class="block text-white mb-1">Password:</label>
                    <input type="password" id="password" name="password" class="w-full rounded px-3 py-2">
                    <span id="passwordError" class="block text-red-200 text-sm mt-1"></span>
                </div>

                <div class="w-full">
                    <label for="email" class="block text-white mb-1">E-mail:</label>
                    <input type="email" id="email" name="email" class="w-full rounded px-3 py-2 shadow-md">
                    <span id="emailError" class="block text-red-200 text-sm mt-1"></span>
                </div>
        </form>
    </section>

    <section class="flex items-center justify-center gap-20">

        <h2 class="text-black text-center text-sm font-semibold mt-3">Select this paw to confirm</h2>

        <!-- Imagen aqui-->
        <img src = "no se" class="w-28 h-28 object-contain rounded-full bg-[#6B5A8E] p-5 shadow-lg" >

    </section>
    </body>
</html>
